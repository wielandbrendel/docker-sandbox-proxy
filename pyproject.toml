[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-sandbox-agents"
version = "0.1.0"
description = "Docker-Sandbox-isolated AI agent management CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.scripts]
sandbox = "sandbox.cli:app"

[tool.setuptools.packages.find]
include = ["sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

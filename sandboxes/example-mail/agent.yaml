name: example-mail
description: "OpenClaw agent with Gmail (operation-filtered) and Telegram"

openclaw:
  version: "2026.5.7"
  port: 18789

workspaces:
  - .

env:
  TZ: "UTC"
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD}
  GOG_ACCOUNT: ${GOG_ACCOUNT}

env_file: .env

gmail_filter:
  enabled: true
  host_port: 8443
  http_port: 8080

network:
  policy: deny
  allow:
    - "api.telegram.org"
    - "*.api.telegram.org"
    - "*.openai.com"
    - "*.chatgpt.com"
    - "chatgpt.com"
    - "*.github.com"
    - "*.githubusercontent.com"
    - "*.npmjs.org"
    - "*.npmjs.com"
    - "*.accounts.google.com"
    - "oauth2.googleapis.com"
    - "nodejs.org"
    - "*.nodejs.org"

resources:
  cpus: "4"
  memory: "8g"

restart_policy: unless-stopped

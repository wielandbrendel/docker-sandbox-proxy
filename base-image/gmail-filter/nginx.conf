worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 256;
}

http {
    resolver 1.1.1.1 8.8.8.8 ipv6=off;
    lua_shared_dict request_cache 1m;

    log_format filter '$remote_addr - $request - $status - $upstream_addr';
    access_log /dev/stdout filter;

    # ── Helper: URI canonicalization ──────────────────────────────
    init_by_lua_block {
        function canonicalize_uri(uri)
            -- Reject null bytes
            if uri:find("%z") or uri:find("%%00") then
                return nil, "null byte detected"
            end

            -- Percent-decode
            local decoded = ngx.unescape_uri(uri)

            -- Detect double-encoding: if decoding again changes the result
            local double_decoded = ngx.unescape_uri(decoded)
            if double_decoded ~= decoded then
                return nil, "double encoding detected"
            end

            -- Normalize path: collapse //, resolve . and ..
            local parts = {}
            for segment in decoded:gmatch("[^/]+") do
                if segment == ".." then
                    table.remove(parts)
                elseif segment ~= "." then
                    table.insert(parts, segment)
                end
            end
            return "/" .. table.concat(parts, "/")
        end
    }

    # ── gmail.googleapis.com — allowlist-based Gmail API filtering ─
    # Also accepts host.docker.internal for Docker Sandbox agents
    server {
        listen 443 ssl;
        server_name gmail.googleapis.com host.docker.internal localhost;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        # Strip method-override headers to prevent HTTP method smuggling
        more_clear_input_headers "X-HTTP-Method-Override" "X-Method-Override";

        location / {
            access_by_lua_block {
                local uri = ngx.var.request_uri
                local method = ngx.req.get_method()

                -- Canonicalize URI
                local canonical, err = canonicalize_uri(uri)
                if not canonical then
                    ngx.log(ngx.WARN, "[gmail-filter] BLOCKED: " .. err .. " in " .. uri)
                    return ngx.exit(403)
                end

                -- Strip query string for clean path matching
                local path = canonical:match("^([^?#]*)") or canonical
                local lower_path = path:lower()

                -- ── Allowlist: only explicitly permitted operations pass ──
                -- Everything not matched below is blocked by default.

                -- GET: allow all read operations (messages, threads, labels, profile, drafts)
                if method == "GET" then
                    return
                end

                -- POST: create draft, modify message labels (for archiving)
                if method == "POST" then
                    -- Create draft: POST /gmail/v1/users/{userId}/drafts
                    if lower_path:match("^/gmail/v1/users/[^/]+/drafts$") then
                        return
                    end
                    -- Modify message labels (archive = remove INBOX label)
                    -- POST /gmail/v1/users/{userId}/messages/{id}/modify
                    if lower_path:match("^/gmail/v1/users/[^/]+/messages/[^/]+/modify$") then
                        return
                    end
                end

                -- PUT: update existing draft
                if method == "PUT" then
                    -- PUT /gmail/v1/users/{userId}/drafts/{id}
                    if lower_path:match("^/gmail/v1/users/[^/]+/drafts/[^/]+$") then
                        return
                    end
                end

                -- DELETE: delete draft only (not messages or threads)
                if method == "DELETE" then
                    -- DELETE /gmail/v1/users/{userId}/drafts/{id}
                    if lower_path:match("^/gmail/v1/users/[^/]+/drafts/[^/]+$") then
                        return
                    end
                end

                -- Block everything else
                ngx.log(ngx.WARN, "[gmail-filter] BLOCKED: " .. method .. " " .. canonical)
                return ngx.exit(403)
            }

            proxy_pass https://gmail.googleapis.com;
            proxy_ssl_server_name on;
            proxy_set_header Host gmail.googleapis.com;
            proxy_set_header X-HTTP-Method-Override "";
            proxy_set_header X-Method-Override "";
        }
    }

    # ── www.googleapis.com — block Gmail API via alternate hostname ─
    server {
        listen 443 ssl;
        server_name www.googleapis.com;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        more_clear_input_headers "X-HTTP-Method-Override" "X-Method-Override";

        # Block all Gmail API paths via this hostname
        location ~ ^/gmail/v1/ {
            access_by_lua_block {
                ngx.log(ngx.WARN, "[gmail-filter] BLOCKED: Gmail API via www.googleapis.com " .. ngx.var.request_uri)
                return ngx.exit(403)
            }
        }

        # Allow other Google APIs through
        location / {
            proxy_pass https://www.googleapis.com;
            proxy_ssl_server_name on;
            proxy_set_header Host www.googleapis.com;
            proxy_set_header X-HTTP-Method-Override "";
            proxy_set_header X-Method-Override "";
        }
    }

    # ── content-gmail.googleapis.com — allowlist for draft uploads ─
    server {
        listen 443 ssl;
        server_name content-gmail.googleapis.com;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        more_clear_input_headers "X-HTTP-Method-Override" "X-Method-Override";

        location / {
            access_by_lua_block {
                local uri = ngx.var.request_uri
                local method = ngx.req.get_method()

                local canonical, err = canonicalize_uri(uri)
                if not canonical then
                    ngx.log(ngx.WARN, "[gmail-filter] BLOCKED: " .. err .. " in " .. uri)
                    return ngx.exit(403)
                end

                local path = canonical:match("^([^?#]*)") or canonical
                local lower_path = path:lower()

                -- ── Allowlist: only draft upload operations ──

                -- GET: allow reads
                if method == "GET" then
                    return
                end

                -- POST: create draft with attachment
                if method == "POST" then
                    if lower_path:match("/gmail/v1/users/[^/]+/drafts$") then
                        return
                    end
                end

                -- PUT: update draft with attachment
                if method == "PUT" then
                    if lower_path:match("/gmail/v1/users/[^/]+/drafts/[^/]+$") then
                        return
                    end
                end

                -- Block everything else
                ngx.log(ngx.WARN, "[gmail-filter] BLOCKED: " .. method .. " " .. canonical)
                return ngx.exit(403)
            }

            proxy_pass https://content-gmail.googleapis.com;
            proxy_ssl_server_name on;
            proxy_set_header Host content-gmail.googleapis.com;
            proxy_set_header X-HTTP-Method-Override "";
            proxy_set_header X-Method-Override "";
        }
    }

    # ── Default: apply Gmail filtering for any unmatched SNI ─────
    # This catches requests from Docker Sandbox agents where SNI may
    # not match gmail.googleapis.com (e.g., localhost, host.docker.internal)
    server {
        listen 443 ssl default_server;
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        more_clear_input_headers "X-HTTP-Method-Override" "X-Method-Override";

        location / {
            access_by_lua_block {
                local uri = ngx.var.request_uri
                local method = ngx.req.get_method()
                local canonical, err = canonicalize_uri(uri)
                if not canonical then
                    ngx.log(ngx.WARN, "[gmail-filter] BLOCKED: " .. err .. " in " .. uri)
                    return ngx.exit(403)
                end
                local path = canonical:match("^([^?#]*)") or canonical
                local lower_path = path:lower()

                if method == "GET" then return end
                if method == "POST" then
                    if lower_path:match("^/gmail/v1/users/[^/]+/drafts$") then return end
                    if lower_path:match("^/gmail/v1/users/[^/]+/messages/[^/]+/modify$") then return end
                end
                if method == "PUT" then
                    if lower_path:match("^/gmail/v1/users/[^/]+/drafts/[^/]+$") then return end
                end
                if method == "DELETE" then
                    if lower_path:match("^/gmail/v1/users/[^/]+/drafts/[^/]+$") then return end
                end

                ngx.log(ngx.WARN, "[gmail-filter] BLOCKED: " .. method .. " " .. canonical)
                return ngx.exit(403)
            }

            proxy_pass https://gmail.googleapis.com;
            proxy_ssl_server_name on;
            proxy_set_header Host gmail.googleapis.com;
            proxy_set_header X-HTTP-Method-Override "";
            proxy_set_header X-Method-Override "";
        }
    }

    # ── Plain HTTP endpoint for Docker Sandbox agents ────────────
    # Agents call http://host.docker.internal:8080/gmail/v1/...
    # Same filtering as the HTTPS endpoint above.
    # No TLS needed: traffic stays within Docker's virtual network.
    server {
        listen 8080;
        server_name _;

        more_clear_input_headers "X-HTTP-Method-Override" "X-Method-Override";

        location / {
            access_by_lua_block {
                local uri = ngx.var.request_uri
                local method = ngx.req.get_method()

                local canonical, err = canonicalize_uri(uri)
                if not canonical then
                    ngx.log(ngx.WARN, "[gmail-filter] BLOCKED: " .. err .. " in " .. uri)
                    return ngx.exit(403)
                end

                local path = canonical:match("^([^?#]*)") or canonical
                local lower_path = path:lower()

                -- GET: allow all reads
                if method == "GET" then return end

                -- POST: create draft, modify labels
                if method == "POST" then
                    if lower_path:match("^/gmail/v1/users/[^/]+/drafts$") then return end
                    if lower_path:match("^/gmail/v1/users/[^/]+/messages/[^/]+/modify$") then return end
                end

                -- PUT: update draft
                if method == "PUT" then
                    if lower_path:match("^/gmail/v1/users/[^/]+/drafts/[^/]+$") then return end
                end

                -- DELETE: delete draft only
                if method == "DELETE" then
                    if lower_path:match("^/gmail/v1/users/[^/]+/drafts/[^/]+$") then return end
                end

                ngx.log(ngx.WARN, "[gmail-filter] BLOCKED: " .. method .. " " .. canonical)
                return ngx.exit(403)
            }

            proxy_pass https://gmail.googleapis.com;
            proxy_ssl_server_name on;
            proxy_set_header Host gmail.googleapis.com;
            proxy_set_header X-HTTP-Method-Override "";
            proxy_set_header X-Method-Override "";
        }
    }
}
